[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "governed-member-services-agent"
version = "0.1.0"
description = "Governed multi-tenant healthcare member-services AI agent with centralized tool gateway and evaluation harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[project.scripts]
member-agent = "member_agent.cli:main"
member-agent-api = "member_agent.api:main"
member-agent-eval = "eval.harness:main"

[tool.setuptools]
packages = ["member_agent", "eval"]

[tool.setuptools.package-dir]
member_agent = "src/member_agent"
eval = "eval"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
