name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-and-governance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test dependencies
        run: pip install -e ".[dev]"
      - name: Run unit, gateway, idempotency, KB, and regression-gate tests
        run: pytest -v
      - name: Verify evaluation regression gate on committed report
        run: |
          python -c "
          import json, pathlib, sys
          from eval.gate import evaluate_gate
          p = pathlib.Path('reports/eval_report.json')
          if not p.exists():
              print('No committed report yet; skipping report check')
              sys.exit(0)
          rep = json.loads(p.read_text())
          res = evaluate_gate(rep)
          for c in res.checks:
              print(f'{c.name}: {\"PASS\" if c.passed else \"FAIL\"} ({c.actual} vs {c.threshold})')
          sys.exit(0 if res.passed else 1)
          "
